<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pets at War</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cellipse cx='6' cy='10' rx='2.2' ry='2.8' fill='%23ffc93c'/%3E%3Cellipse cx='10' cy='6' rx='2.2' ry='2.8' fill='%23ffc93c'/%3E%3Cellipse cx='14.5' cy='6' rx='2.2' ry='2.8' fill='%23ffc93c'/%3E%3Cellipse cx='18.5' cy='10' rx='2.2' ry='2.8' fill='%23ffc93c'/%3E%3Cpath d='M12 11c3 0 6 4.5 6 7 0 2-2 2.6-3.2 2.2-1-.3-1.8-.8-2.8-.8s-1.8.5-2.8.8C8 20.6 6 20 6 18c0-2.5 3-7 6-7z' fill='%23ffc93c'/%3E%3C/svg%3E" />

    <style>
/* Pets at War — HUD and menus.
   Layout: full-screen WebGL canvas, HUD pinned to the four corners, modal panels centred. */
:root {
  --ink: #0d1324;
  --panel: rgba(14, 20, 38, 0.74);
  --panel-solid: #141c33;
  --panel-2: #1c2645;
  --line: rgba(255, 255, 255, 0.13);
  --text: #f4f6ff;
  --muted: #9aa6c6;
  --gold: #ffc93c;
  --gold-deep: #c98a00;
  --hp: #ff4d5e;
  --pet: #4fe08c;
  --ally: #4fb4ff;
  --danger: #ff5a6e;
  --font-display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --font-ui: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
#ui button, #ui .slot, #panel, #menu, #pause, #gameover, #victory { pointer-events: auto; }
[hidden] { display: none !important; }
kbd {
  display: inline-block; min-width: 1.5em; padding: 1px 6px; border-radius: 6px;
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-bottom-width: 3px;
  font-family: var(--font-display); font-size: 0.92em; line-height: 1.3; text-align: center; color: var(--text);
}
.ico { width: 1em; height: 1em; vertical-align: -0.12em; }
.muted { color: var(--muted); }
.outline { text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 0 2px rgba(0,0,0,.6); }
.coin-ico {
  display: inline-block; width: 1em; height: 1em; border-radius: 50%; vertical-align: -0.14em;
  background: radial-gradient(circle at 35% 30%, #fff3b0 0 18%, #ffd24a 30%, #e6a400 70%, #b37800 100%);
  box-shadow: inset 0 0 0 2px rgba(150, 90, 0, 0.55);
}

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; }
.hud-tl {
  position: absolute; top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left));
  display: flex; flex-direction: column; gap: 8px; width: 300px;
}
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 9px 11px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.card-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.label { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 12px;
  padding: 2px 8px; border-radius: 99px; background: rgba(255,255,255,0.08); color: #cfe0ff;
}
.heal-chip { color: #9dffc9; }
.heal-chip.active { background: rgba(79, 224, 140, 0.22); animation: pulse 0.8s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.bar {
  position: relative; height: 18px; border-radius: 9px; background: rgba(0,0,0,0.45); overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
}
.bar .fill, .bar .lag { position: absolute; inset: 0 auto 0 0; border-radius: 9px; transition: width 0.12s linear; }
.bar .lag { background: rgba(255, 255, 255, 0.55); transition: none; }
.bar.hp .fill { background: linear-gradient(180deg, #ff8a8f, var(--hp) 55%, #c9263a); }
.bar.hp.low .fill { animation: blink 0.6s steps(2) infinite; }
@keyframes blink { 50% { filter: brightness(1.6); } }
.bar.pet .fill { background: linear-gradient(180deg, #a8ffd0, var(--pet) 55%, #22a35d); }
.bar span {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 12px; letter-spacing: 0.04em;
  text-shadow: 0 1px 0 rgba(0,0,0,.6); font-variant-numeric: tabular-nums;
}
.pet-card { display: flex; gap: 10px; align-items: center; }
.pet-card img { width: 58px; height: 58px; border-radius: 12px; background: radial-gradient(circle at 50% 40%, rgba(94,255,168,.28), rgba(94,255,168,0) 70%); flex: none; }
.pet-info { flex: 1; min-width: 0; }
.pet-card .sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; font-weight: 700; }
.pet-card.danger { border-color: rgba(255, 90, 110, 0.8); box-shadow: 0 0 0 2px rgba(255,90,110,.35), 0 0 24px rgba(255,90,110,.35); }
.pet-card.danger .sub { color: #ff9aa8; }
.pet-card.shake { animation: shake 0.3s; }
@keyframes shake { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
#allyList { display: flex; flex-direction: column; gap: 5px; }
.ally {
  display: grid; grid-template-columns: 18px 1fr 90px; align-items: center; gap: 6px;
  background: var(--panel); border: 1px solid rgba(79,180,255,.35); border-radius: 10px; padding: 5px 9px;
  font-weight: 800; font-size: 12px;
}
.ally-ico { color: var(--ally); }
.bar.mini { height: 8px; }
.ally-bar .fill { background: linear-gradient(180deg, #a8dcff, var(--ally)); }

.hud-top {
  position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  text-align: center; pointer-events: none;
}
#waveTitle {
  font-family: var(--font-display); font-size: 30px; letter-spacing: 0.06em; color: #fff;
  text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,0,0,.35);
}
#waveSub {
  display: inline-block; margin-top: 2px; padding: 3px 12px; border-radius: 99px; background: var(--panel);
  font-weight: 800; font-size: 13px; color: #dfe6ff; font-variant-numeric: tabular-nums;
}

.hud-tr {
  position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right));
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
}
.money {
  position: relative; display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px;
  background: var(--panel); border: 1px solid rgba(255, 201, 60, 0.35); border-radius: 99px;
  font-family: var(--font-display); font-size: 24px; color: var(--gold); font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 0 rgba(0,0,0,.35);
}
#moneyPop {
  position: absolute; right: 12px; top: 100%; font-size: 16px; opacity: 0; color: #fff2b0;
}
#moneyPop.pop { animation: moneyPop 0.9s ease-out; }
@keyframes moneyPop { 0% { opacity: 1; transform: translateY(-6px); } 100% { opacity: 0; transform: translateY(14px); } }
.map-wrap {
  position: relative; width: 190px; height: 190px; border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(255,255,255,0.85), 0 0 0 6px rgba(13,19,36,0.55), 0 8px 24px rgba(0,0,0,.35);
}
#minimap { width: 190px; height: 190px; border-radius: 50%; display: block; }
.kills {
  display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 99px; background: var(--panel);
  font-family: var(--font-display); font-size: 16px; color: #ffd0d0;
}

#notifs {
  position: absolute; right: max(14px, env(safe-area-inset-right)); top: 300px;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px; max-width: 340px;
}
.notif {
  display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line); border-right: 3px solid var(--c);
  font-weight: 700; font-size: 13px; color: #e9eeff; animation: notifIn 0.25s ease-out;
  transition: opacity 0.5s, transform 0.5s;
}
.notif img { width: 30px; height: 30px; }
.notif.out { opacity: 0; transform: translateX(20px); }
@keyframes notifIn { from { opacity: 0; transform: translateX(30px); } }

.hud-bl {
  position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom));
  display: flex; align-items: flex-end; gap: 10px;
}
.ability {
  position: relative; width: 64px; height: 64px; border-radius: 16px; overflow: hidden;
  background: var(--panel); border: 2px solid rgba(255,255,255,0.18);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ability.ready { border-color: var(--pet); box-shadow: 0 0 16px rgba(79,224,140,.45); }
.ab-key { font-family: var(--font-display); font-size: 22px; color: #bfffdc; line-height: 1; }
.ab-txt { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; }
.ab-cd { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.55); }
.hint { position: absolute; left: 2px; bottom: calc(100% + 8px); width: 260px; font-weight: 700; font-size: 12px; color: var(--muted); text-shadow: 0 1px 3px rgba(0,0,0,.6); }

.hud-bottom {
  position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
#weaponInfo {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
  padding: 4px 12px; border-radius: 99px; background: var(--panel); font-size: 12.5px; font-weight: 700;
}
.wi-name { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.02em; }
.wi-stats { color: #c3cce6; }
.el-tag {
  display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 900;
  color: var(--el); background: color-mix(in srgb, var(--el) 18%, transparent); border: 1px solid color-mix(in srgb, var(--el) 50%, transparent);
  vertical-align: 1px;
}
#hotbar { display: flex; gap: 6px; }
.slot {
  position: relative; width: 58px; height: 58px; border-radius: 13px; padding: 0; cursor: pointer;
  background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--rar, #888) 30%, transparent), rgba(14,20,38,.78) 70%);
  border: 2px solid rgba(255,255,255,0.14); transition: transform 0.12s;
}
.slot img { width: 100%; height: 100%; display: block; }
.slot.empty { background: rgba(14,20,38,0.45); border-style: dashed; border-color: rgba(255,255,255,0.1); cursor: default; }
.slot.on { border-color: #fff; transform: translateY(-5px); box-shadow: 0 0 0 2px var(--rar), 0 6px 18px rgba(0,0,0,.4); }
.slot .sk {
  position: absolute; left: 5px; top: 2px; font-family: var(--font-display); font-size: 12px; color: rgba(255,255,255,.85);
  text-shadow: 0 1px 0 #000;
}
.slot .el-dot { position: absolute; right: 5px; top: 5px; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }

#crosshair {
  position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); opacity: 0;
}
#crosshair.on { opacity: 1; }
#crosshair::before, #crosshair::after {
  content: ''; position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.55); border-radius: 1px;
}
#crosshair::before { left: 10px; top: 3px; width: 2px; height: 16px; }
#crosshair::after { top: 10px; left: 3px; height: 2px; width: 16px; }

#prompt {
  position: absolute; left: 50%; top: 62%; transform: translateX(-50%);
  padding: 8px 16px; border-radius: 12px; background: rgba(14,20,38,0.85); border: 1px solid rgba(255,255,255,.2);
  font-weight: 800; font-size: 15px; white-space: nowrap;
}
#prompt kbd { margin-right: 4px; background: #fff; color: var(--ink); border-color: #fff; border-bottom-color: #b7c0d8; }

#banner {
  position: absolute; left: 0; right: 0; top: 22%; text-align: center; opacity: 0; pointer-events: none;
  padding: 0 16px;
}
#banner.show { animation: banner 3.6s ease-out forwards; }
@keyframes banner {
  0% { opacity: 0; transform: scale(1.4); }
  8% { opacity: 1; transform: scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-14px); }
}
.b-title {
  font-family: var(--font-display); font-size: clamp(34px, 6vw, 64px); letter-spacing: 0.04em; color: var(--c);
  text-shadow: 0 4px 0 rgba(0,0,0,.35), 0 0 30px color-mix(in srgb, var(--c) 45%, transparent);
  text-wrap: balance;
}
.b-sub {
  display: inline-block; margin-top: 6px; padding: 5px 14px; border-radius: 99px; background: rgba(14,20,38,0.72);
  font-weight: 800; font-size: 15px; max-width: 640px;
}
#vignette, #petVignette { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
#vignette { box-shadow: inset 0 0 120px 30px rgba(255, 30, 50, 0.65); }
#petVignette { box-shadow: inset 0 0 90px 10px rgba(255, 90, 170, 0.55); }
#vignette.hit, #petVignette.hit { animation: vig 0.45s ease-out; }
@keyframes vig { 0% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- world labels ---------- */
#labels { position: absolute; inset: 0; overflow: hidden; }
.mlabel { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; will-change: transform; }
.ml-name {
  display: flex; align-items: center; gap: 4px; font-weight: 900; font-size: 12px; white-space: nowrap;
  text-shadow: 0 1px 0 #000, 0 0 3px #000;
}
.ml-name em { font-style: normal; font-size: 10px; color: #c9d1ea; }
.ml-bar { width: 64px; height: 7px; border-radius: 4px; background: rgba(0,0,0,.6); overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
.ml-fill { height: 100%; background: linear-gradient(180deg, #ff8a8f, #e8364b); }
.mlabel.ally .ml-fill { background: linear-gradient(180deg, #a8dcff, var(--ally)); }
.mlabel.ally .ml-name { color: #bfe3ff; }
.mlabel.ally .ml-name .ico { color: #ff7aa8; }
.mlabel.tame .ml-name { color: #ffe7a0; }
.mlabel.tame .ml-name .ico { color: var(--gold); animation: pulse 0.6s infinite; }
.mlabel.boss .ml-bar { width: 140px; height: 10px; }
.mlabel.boss .ml-name { font-family: var(--font-display); font-size: 15px; color: #e2b6ff; font-weight: 400; }
.wlabel {
  position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center;
  padding: 4px 10px; border-radius: 10px; background: rgba(14,20,38,0.7); border: 1px solid rgba(255, 201, 60, .5);
}
.wlabel b { font-family: var(--font-display); font-weight: 400; color: var(--gold); font-size: 15px; letter-spacing: 0.03em; }
.wlabel span { font-size: 11px; font-weight: 800; color: #dfe6ff; }
.dmg {
  position: absolute; left: 0; top: 0; font-family: var(--font-display); font-size: 20px; white-space: nowrap;
  text-shadow: 0 2px 0 rgba(0,0,0,.65), 0 0 4px rgba(0,0,0,.7); will-change: transform, opacity;
  display: flex; flex-direction: column; align-items: center; line-height: 1;
}
.dmg.big { font-size: 30px; }
.dmg.small { font-size: 15px; }
.dmg.player { font-size: 22px; }
.dmg.pet { font-size: 22px; }
.dmg small { font-size: 11px; letter-spacing: 0.1em; color: #fff; }

/* ---------- shared modal look ---------- */
#menu, #pause, #gameover, #victory, #panel {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  box-sizing: border-box;
}
#pause, #gameover, #victory { background: rgba(8, 12, 24, 0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.modal {
  width: min(520px, 100%); padding: 26px 26px 22px; border-radius: 22px; text-align: center; box-sizing: border-box;
  background: linear-gradient(180deg, var(--panel-2), var(--panel-solid)); border: 1px solid var(--line);
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.modal h2 { font-family: var(--font-display); font-weight: 400; font-size: 36px; margin: 0 0 4px; letter-spacing: 0.03em; text-wrap: balance; }
.modal p { margin: 0 0 16px; }
button { font-family: var(--font-ui); }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.play {
  font-family: var(--font-display); font-size: 30px; letter-spacing: 0.08em; color: #3a2400; cursor: pointer;
  padding: 12px 56px; border-radius: 16px; border: 0;
  background: linear-gradient(180deg, #ffe27a, var(--gold) 50%, #f0a800);
  box-shadow: 0 6px 0 var(--gold-deep), 0 12px 24px rgba(0,0,0,.35);
  transition: transform 0.1s, box-shadow 0.1s;
}
.play:hover { transform: translateY(-2px); }
.play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--gold-deep), 0 6px 12px rgba(0,0,0,.35); }
.play.small { font-size: 22px; padding: 9px 34px; }
.opt {
  cursor: pointer; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(255,255,255,0.07); color: var(--text); font-weight: 800; font-size: 13px;
}
.opt:hover { background: rgba(255,255,255,0.14); }
.menu-opts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

/* ---------- main menu ---------- */
#menu { background: radial-gradient(ellipse at 50% 30%, rgba(13,19,36,0.15), rgba(13,19,36,0.7)); overflow-y: auto; align-items: safe center; }
.menu-inner { width: min(860px, 100%); text-align: center; padding-block: 12px; }
.logo { display: flex; align-items: baseline; justify-content: center; gap: 14px; line-height: 0.9; }
.logo .l1 {
  font-family: var(--font-display); font-size: clamp(56px, 11vw, 112px); color: #fff; letter-spacing: 0.02em;
  text-shadow: 0 6px 0 #c98a00, 0 10px 0 rgba(0,0,0,.3), 0 0 40px rgba(255, 201, 60, .35);
  -webkit-text-stroke: 2px #6b3d00;
}
.logo .l1:first-child { color: var(--gold); }
.logo .l2 { font-family: var(--font-display); font-size: clamp(28px, 5vw, 46px); color: #bfffdc; text-shadow: 0 4px 0 #1f7a4a; }
.credits {
  margin: 10px 0 0; font-size: 15px; font-weight: 800; letter-spacing: 0.04em; color: #e8eeff;
  text-shadow: 0 2px 6px rgba(0,0,0,.65);
}
.credits b { font-family: var(--font-display); font-weight: 400; font-size: 18px; letter-spacing: 0.03em; color: var(--gold); }
.tagline { font-weight: 800; font-size: 18px; margin: 10px 0 18px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
.tagline span { display: inline-block; margin-top: 6px; font-size: 15px; color: #bfefff; max-width: 60ch; text-wrap: balance; }
.pet-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
/* difficulty picker */
.diff-wrap { margin: 0 auto 18px; max-width: 560px; }
.diff-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 5px; border-radius: 16px; background: rgba(14,20,38,0.72); border: 1px solid var(--line); }
.diff-pick {
  display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 10px; cursor: pointer;
  border-radius: 12px; border: 2px solid transparent; background: transparent; color: var(--muted);
  font-family: var(--font-display); font-size: 21px; letter-spacing: 0.03em; transition: background .12s, color .12s, border-color .12s;
}
.diff-pick:hover { background: rgba(255,255,255,0.07); color: var(--text); }
.diff-pick.on { color: #fff; border-color: var(--dc); background: color-mix(in srgb, var(--dc) 22%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--dc) 30%, transparent); }
.dp-pips { display: inline-flex; gap: 3px; }
.dp-pips i { width: 7px; height: 14px; border-radius: 3px; background: var(--dc); opacity: 0.85; }
.diff-pick:not(.on) .dp-pips i { opacity: 0.45; }
.diff-blurb { margin: 8px 0 0; min-height: 2.6em; font-size: 13.5px; font-weight: 800; color: #dfe6ff; text-shadow: 0 2px 6px rgba(0,0,0,.7); text-wrap: balance; }
.diff-tag {
  display: inline-block; padding: 1px 9px; margin-right: 4px; border-radius: 99px; font-weight: 900; font-size: 12px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--dc); border: 1px solid color-mix(in srgb, var(--dc) 60%, transparent);
  background: color-mix(in srgb, var(--dc) 14%, transparent); vertical-align: 1px;
}
.pet-pick {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 10px 14px; cursor: pointer;
  border-radius: 18px; border: 2px solid var(--line); color: var(--text);
  background: linear-gradient(180deg, rgba(28,38,69,.88), rgba(20,28,51,.92)); transition: transform .12s, border-color .12s;
}
.pet-pick:hover { transform: translateY(-3px); }
.pet-pick.on { border-color: var(--pet); box-shadow: 0 0 0 3px rgba(79,224,140,.3), 0 10px 30px rgba(0,0,0,.4); }
.pet-pick img { width: 96px; height: 96px; }
.pp-name { font-family: var(--font-display); font-size: 24px; letter-spacing: 0.02em; }
.pp-species { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.12em; color: var(--pet); }
.pp-stats { font-size: 13px; color: #dfe6ff; margin-top: 4px; }
.pp-blurb { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.best { margin-top: 12px; font-weight: 800; color: var(--gold); }
.controls {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 16px; margin: 22px auto 0; max-width: 760px;
  padding: 14px 16px; border-radius: 16px; background: rgba(14,20,38,0.7); font-size: 13px; font-weight: 700; color: #c9d2ee;
  text-align: left;
}
.controls.compact { grid-template-columns: 1fr; margin-top: 16px; text-align: center; }
.controls .wide { grid-column: 1 / -1; color: #bfefff; }
.mlabel.boss.titan .ml-name { color: #bfefff; }
.mlabel.boss.dragon .ml-name { color: #ffb08a; font-size: 17px; }
.mlabel.boss.dragon .ml-bar { width: 170px; }
.controls kbd { margin-right: 2px; }

/* ---------- game over ---------- */
.go-pet { width: 120px; height: 120px; filter: grayscale(0.7) brightness(0.8); transform: rotate(-12deg); }
.go-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 6px 0 18px; }
.go-stats div { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; }
.go-stats b { font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--gold); font-variant-numeric: tabular-nums; }
.go-stats span { font-size: 11.5px; font-weight: 800; color: var(--muted); }
.go-btns { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }

/* ---------- shop / backpack panel ---------- */
#panel { background: rgba(8, 12, 24, 0.5); }
.panel-inner {
  width: min(920px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden;
  background: linear-gradient(180deg, var(--panel-2), var(--panel-solid)); border: 1px solid var(--line);
  border-radius: 22px; box-shadow: 0 24px 70px rgba(0,0,0,.55);
}
.panel-inner header {
  display: flex; align-items: center; gap: 14px; padding: 16px 18px 10px;
  background: repeating-linear-gradient(90deg, rgba(226,72,61,.18) 0 28px, rgba(255,243,224,.06) 28px 56px);
}
.ph-title { font-family: var(--font-display); font-size: 28px; letter-spacing: 0.03em; flex: 1; }
.ph-money {
  display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 22px; color: var(--gold);
  padding: 4px 12px; border-radius: 99px; background: rgba(0,0,0,.3); font-variant-numeric: tabular-nums;
}
.close { cursor: pointer; border: 1px solid var(--line); background: rgba(255,255,255,.08); color: var(--text); font-weight: 800; padding: 7px 10px; border-radius: 10px; }
.panel-inner nav { display: flex; gap: 6px; padding: 8px 18px 0; flex-wrap: wrap; }
.tab {
  cursor: pointer; padding: 8px 14px; border-radius: 12px 12px 0 0; border: 0; font-weight: 900; font-size: 13.5px;
  background: rgba(255,255,255,0.05); color: var(--muted);
}
.tab.on { background: rgba(255,255,255,0.12); color: #fff; box-shadow: inset 0 -3px 0 var(--gold); }
.panel-msg { min-height: 0; padding: 0 18px; color: #ffb3bd; font-weight: 800; font-size: 13px; }
.panel-msg.on { padding-top: 8px; }
.panel-body { padding: 10px 18px 18px; overflow-y: auto; border-top: 1px solid var(--line); }
.panel-body h3 { font-family: var(--font-display); font-weight: 400; font-size: 18px; margin: 10px 0 8px; letter-spacing: 0.03em; }
.tab-note { color: var(--muted); font-weight: 700; margin: 4px 0 10px; max-width: 65ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.scard {
  display: grid; grid-template-columns: 64px minmax(0, 1fr); grid-template-rows: auto auto; gap: 4px 10px; align-items: center;
  padding: 10px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--line);
}
.scard.owned { border-color: rgba(255,255,255,.45); background: rgba(255,255,255,0.09); }
.sc-ico {
  grid-row: span 2; width: 64px; height: 64px; border-radius: 12px;
  background: radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--rar) 40%, transparent), transparent 70%);
}
.sc-ico img { width: 100%; height: 100%; }
.sc-name { font-weight: 900; font-size: 14.5px; }
.sc-rar { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: var(--rar); }
.sc-stat { font-size: 12.5px; color: #dfe6ff; font-weight: 700; }
.sc-extra { font-size: 12px; color: var(--muted); font-weight: 700; }
.sc-buy { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.buy {
  cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 10px; border: 0;
  font-weight: 900; font-size: 13px; color: #2b1a00; background: linear-gradient(180deg, #ffe27a, var(--gold));
  box-shadow: 0 3px 0 var(--gold-deep);
}
.buy span { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.buy:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-deep); }
.buy.poor { filter: grayscale(0.85) brightness(0.75); }
.buy.maxed { background: rgba(255,255,255,.1); color: var(--muted); box-shadow: none; cursor: default; }
.buy.alt { background: rgba(255,255,255,.14); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.buy.sell { background: rgba(255, 201, 60, 0.14); color: var(--gold); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.equipped { font-weight: 900; font-size: 12px; color: var(--pet); padding: 0 4px; }
.held {
  display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 12px; align-items: center; margin: 6px 0 12px;
  padding: 12px; border-radius: 16px; background: radial-gradient(circle at 0% 50%, color-mix(in srgb, var(--rar, #5effa8) 22%, transparent), rgba(255,255,255,.04) 45%);
  border: 1px solid var(--line);
}
.held img { width: 84px; height: 84px; }
.held-lbl { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.held-name { font-family: var(--font-display); font-size: 22px; }
.held-stat { font-weight: 800; color: #dfe6ff; }
.held-ench { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.held-swap { font-size: 12px; color: var(--muted); font-weight: 700; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: grid; grid-template-columns: 200px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--line);
}
.row-name { font-weight: 900; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-desc { font-size: 12.5px; color: #c9d2ee; font-weight: 700; }
.row-desc b { color: #fff; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 9px; height: 9px; border-radius: 3px; background: rgba(255,255,255,.15); }
.pips i.on { background: var(--gold); box-shadow: 0 0 6px rgba(255,201,60,.6); }
.pips.el i.on { background: var(--el); box-shadow: 0 0 6px var(--el); }
.el-swatch { width: 14px; height: 14px; border-radius: 50%; background: var(--el); box-shadow: 0 0 10px var(--el); }
.el-row { border-color: color-mix(in srgb, var(--el) 30%, transparent); }

/* ---------- touch controls ---------- */
#touch { display: none; }
body.touch #touch { display: block; }
body.touch #crosshair { opacity: 1; }
.stick {
  position: absolute; width: 120px; height: 120px; border-radius: 50%; left: 30px; bottom: 120px; top: auto;
  background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); opacity: 0.5; pointer-events: none;
}
.stick.on { opacity: 1; }
.knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.45); }
.tbtns {
  position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: 120px;
  display: grid; grid-template-columns: repeat(3, 56px); gap: 8px; pointer-events: auto;
}
.tb {
  width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); background: rgba(14,20,38,.6);
  color: #fff; font-family: var(--font-display); font-size: 13px;
}
.tb.big { grid-column: span 3; width: 100%; border-radius: 28px; background: rgba(255, 90, 110, .55); font-size: 18px; }

/* ---------- v2: quests, bosses, riding, travel ---------- */
.quests { padding: 8px 11px; display: flex; flex-direction: column; gap: 4px; }
.q-head { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 15px; letter-spacing: 0.03em; color: #bfefff; }
.q-head.dragon { color: #ffb08a; }
.q-row { display: flex; align-items: flex-start; gap: 7px; font-size: 12.5px; font-weight: 800; color: #dfe6ff; line-height: 1.3; }
.q-row i {
  flex: none; width: 15px; height: 15px; margin-top: 1px; border-radius: 5px; display: grid; place-items: center;
  border: 2px solid var(--qc, #7dffb0); font-style: normal; font-size: 11px; color: #0d1324; box-sizing: border-box;
}
.q-row.done { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.35); }
.q-row.done i { background: var(--qc); }
.q-row.done i .ico { width: 11px; height: 11px; }
.q-row em { font-style: normal; color: var(--qc); font-variant-numeric: tabular-nums; }
.q-row.next { color: #fff; }
.q-row.next i { background: var(--qc, #7dffb0); border-color: var(--qc, #7dffb0); font-family: var(--font-display); animation: pulse 0.9s infinite; }
.q-tip { font-size: 11.5px; font-weight: 800; color: var(--muted); margin-left: 22px; }

#bossBar { margin: 8px auto 0; width: min(460px, 70vw); }
#safeChip {
  display: inline-flex; align-items: center; gap: 7px; margin-top: 8px; padding: 5px 14px; border-radius: 99px;
  font-weight: 900; font-size: 13px; color: #d9fff3; background: rgba(10, 60, 50, 0.7); border: 1px solid rgba(94,255,208,0.55);
  box-shadow: 0 0 18px rgba(94,255,208,0.3);
}
#safeChip .ico { color: #5effd0; font-size: 16px; }
.wlabel b.safe { color: #7dffd8; }
.clear-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 4px; padding: 10px 12px; border-radius: 14px;
  background: rgba(255, 201, 60, 0.07); border: 1px dashed rgba(255, 201, 60, 0.35); font-weight: 700; font-size: 12.5px; color: #c9d2ee;
}
.clear-bar > span { flex: 1 1 260px; }
.clear-bar.confirm { background: rgba(255, 90, 110, 0.1); border: 1px solid rgba(255, 120, 130, 0.5); color: #ffe0e4; }
.clear-bar.empty { background: rgba(255,255,255,0.04); border-color: var(--line); color: var(--muted); }
#bossBar .bb-name { font-family: var(--font-display); font-size: 18px; letter-spacing: 0.05em; color: #e2b6ff; text-shadow: 0 2px 0 rgba(0,0,0,.5); }
#bossBar.titan .bb-name { color: #bfefff; }
#bossBar.dragon .bb-name { color: #ffb08a; font-size: 21px; }
.bb-bar { height: 14px; margin-top: 3px; border-radius: 99px; background: rgba(10,14,28,.8); border: 2px solid rgba(255,255,255,.25); overflow: hidden; }
.bb-fill { height: 100%; width: 100%; background: linear-gradient(180deg, #e2a0ff, #9a4ad8); transition: width 0.15s; }
#bossBar.titan .bb-fill { background: linear-gradient(180deg, #d8f6ff, #5ab8e8); }
#bossBar.dragon .bb-fill { background: linear-gradient(180deg, #ffd27a, #ff5a1a 55%, #c01a0a); }

.ability.ride .ab-key { color: #bfefff; }
.ability.ride.ready { border-color: #8fe8ff; box-shadow: 0 0 16px rgba(143,232,255,.45); }

#flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle, #fff 0%, var(--c, #fff) 45%, transparent 100%); }
#flash.on { animation: flash 0.7s ease-out; }
@keyframes flash { 0% { opacity: 0.95; } 100% { opacity: 0; } }

.wlabel.sealed b { color: #ff6a7a; }
.wlabel b.elder { color: #9fffc8; }
.wlabel.alert { animation: bob 1.2s ease-in-out infinite; }
.wlabel .bang {
  display: block; margin: 0 auto 2px; width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: #3a2400;
  font-family: var(--font-display); font-style: normal; font-size: 20px; line-height: 26px; box-shadow: 0 0 18px rgba(255,201,60,.7);
}
@keyframes bob { 50% { margin-top: -6px; } }

.elder-say {
  display: grid; gap: 6px; padding: 14px 16px; margin: 6px 0 12px; border-radius: 16px;
  background: linear-gradient(180deg, rgba(79,224,140,.12), rgba(79,224,140,.04)); border: 1px solid rgba(79,224,140,.3);
}
.elder-say p { margin: 0; font-weight: 700; color: #dfe6ff; line-height: 1.45; max-width: 70ch; }
.es-who { font-family: var(--font-display); font-size: 16px; color: #9fffc8; letter-spacing: 0.03em; }
.elder-say .empower { justify-self: start; margin-top: 6px; }
.qlist { display: flex; flex-direction: column; gap: 8px; }
.qcard {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px;
  border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-left: 4px solid var(--qc);
}
.qc-check {
  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; border: 2px solid var(--qc); color: #0d1324;
}
.qcard.done .qc-check { background: var(--qc); }
.qcard.final .qc-check { color: var(--qc); }
.qcard.final.done .qc-check { color: #0d1324; }
.qc-relic { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: var(--qc); }
.qc-title { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.02em; }
.qc-where { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.qc-state { font-weight: 900; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.qcard.done .qc-state { color: var(--qc); }
.qbar { height: 8px; margin: 6px 0 2px; border-radius: 99px; background: rgba(0,0,0,.35); overflow: hidden; max-width: 260px; }
.qbar div { height: 100%; background: var(--qc); }

.modal.win { border-color: rgba(255,201,60,.5); box-shadow: 0 0 0 1px rgba(255,201,60,.2), 0 20px 80px rgba(255,140,40,.25); }
.modal.win .go-pet { filter: none; transform: rotate(-6deg); }
.win-kicker { font-family: var(--font-display); color: var(--gold); letter-spacing: 0.2em; text-transform: uppercase; font-size: 15px; }

/* ---------- small screens ---------- */
@media (max-width: 760px) {
  .hud-tl { width: 220px; transform: scale(0.85); transform-origin: top left; }
  .hud-tr { transform: scale(0.7); transform-origin: top right; }
  #notifs { top: 210px; max-width: 240px; }
  #waveTitle { font-size: 22px; }
  .hud-top { top: auto; bottom: 150px; }
  .slot { width: 40px; height: 40px; border-radius: 9px; }
  #hotbar { gap: 4px; }
  #weaponInfo { display: none; }
  .pet-row { grid-template-columns: 1fr; }
  .pet-pick { flex-direction: row; flex-wrap: wrap; justify-content: center; column-gap: 10px; }
  .pet-pick img { width: 64px; height: 64px; }
  .diff-pick { font-size: 17px; padding: 8px 4px; }
  .controls { grid-template-columns: 1fr; }
  .row { grid-template-columns: minmax(0, 1fr); }
  .held { grid-template-columns: 64px minmax(0, 1fr); }
  .held img { width: 64px; height: 64px; }
  .held-swap { grid-column: span 2; }
  .go-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hud-bl { bottom: 70px; }
  .ability { width: 52px; height: 52px; }
  .hint { display: none; }
  .quests { display: none; }
  .qcard { grid-template-columns: 30px minmax(0, 1fr); }
  .qc-state { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #banner.show { animation-duration: 3.6s; animation-name: bannerFade; }
  @keyframes bannerFade { 0%, 100% { opacity: 0; } 10%, 85% { opacity: 1; } }
  .heal-chip.active, .mlabel.tame .ml-name .ico, .q-row.next i, .wlabel.alert { animation: none; }
  #flash.on { animation-duration: 0.3s; }
}
